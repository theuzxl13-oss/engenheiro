# Publica a prévia estática (modo demonstração) no branch gh-pages.
# Ative em Settings → Pages → Deploy from a branch → gh-pages / (root).
name: Prévia GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar prévia estática
        run: npm run build:pages
        env:
          PAGES_REPO: ${{ github.event.repository.name }}
          PAGES_OWNER: ${{ github.repository_owner }}

      - name: Publicar no branch gh-pages
        working-directory: out
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Prévia gerada a partir de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
